name: Verificar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências exatas
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Testar regras, ortografia e serviços
        run: npm test
      - name: Instalar Chromium para os testes reais
        run: npx playwright install --with-deps chromium
      - name: Gerar versão de produção
        run: npm run build
      - name: Verificar recursos estáticos e caminhos de publicação
        run: node scripts/check-build.mjs
      - name: Testar interface e funcionamento offline
        run: npm run test:e2e -- --project=chromium
      - name: Empacotar site verificado
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar arquivos estáticos
        id: deployment
        uses: actions/deploy-pages@v4
